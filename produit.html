<!doctype html>
<html lang="fr" data-root="">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fiche produit — CroqFruit</title>
<meta name="description" content="Détail d'un produit de la boutique CroqFruit.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Fraunces:ital,wght@0,300;0,400;0,500;0,600;1,400;1,500&family=Work+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/boutique.css">
<script src="js/layout.js"></script>
</head>
<body>

<site-header active="boutique"></site-header>

<main>
  <div class="wrap page-body">
    <ol class="crumbs"><li><a href="index.html">Accueil</a></li><li><a href="boutique.html">Boutique</a></li><li>Produit</li></ol>

    <p class="callout" style="margin-bottom:1.5rem"><strong>Maquette.</strong> Cette fiche affichera les informations d'un produit de la boutique (nom, prix, description, photo) une fois reliée aux données.</p>

    <div class="split">
      <div class="product-detail-media"><span class="product-placeholder" aria-hidden="true">?</span></div>

      <div class="product-detail-info">
        <span class="product-category">Catégorie</span>
        <h1 style="font-size:var(--step-h2)">Nom du produit</h1>
        <p class="product-detail-price">— € <span class="product-unit">/ unité</span></p>

        <div class="stack" style="gap:.6rem" aria-hidden="true">
          <div class="sk" style="width:100%"></div>
          <div class="sk" style="width:92%"></div>
          <div class="sk" style="width:64%"></div>
        </div>

        <div class="form-actions">
          <div class="stepper"><button type="button" aria-label="Retirer un" disabled>−</button><span class="stepper-qty">1</span><button type="button" aria-label="Ajouter un" disabled>+</button></div>
          <button type="button" class="btn btn-primary" disabled>Ajouter au panier</button>
        </div>

        <dl class="info-list">
          <div class="info-row"><dt>Origine</dt><dd>—</dd></div>
          <div class="info-row"><dt>Conservation</dt><dd>—</dd></div>
        </dl>
      </div>
    </div>

    <p style="margin-top:2rem"><a class="btn-text" href="boutique.html">← Retour à la boutique</a></p>
  </div>
</main>

<site-footer></site-footer>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/supabase-client.js"></script>
<script src="js/cart.js"></script>
<script src="js/auth.js"></script>
</body>
</html>
