<!doctype html>
<html lang="fr" data-root="">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nouveau mot de passe — CroqFruit</title>
<meta name="description" content="Choisissez un nouveau mot de passe pour votre compte CroqFruit.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Fraunces:ital,wght@0,300;0,400;0,500;0,600;1,400;1,500&family=Work+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<script src="js/layout.js"></script>
</head>
<body>

<site-header active=""></site-header>

<main class="auth-page">
  <div class="wrap">
    <div class="auth-card">
      <div>
        <span class="eyebrow">Compte</span>
        <h1>Nouveau mot de passe</h1>
        <p class="lede">Choisissez un nouveau mot de passe pour votre compte. Cette page s'ouvre depuis le lien reçu par email.</p>
      </div>

      <p class="callout"><strong>Bientôt disponible.</strong> La réinitialisation du mot de passe n'est pas encore activée.</p>

      <form class="form">
        <label class="field">Nouveau mot de passe
          <input type="password" name="password" required autocomplete="new-password" minlength="8">
          <small>8 caractères minimum.</small>
        </label>
        <label class="field">Confirmer le mot de passe
          <input type="password" name="confirmPassword" required autocomplete="new-password" minlength="8">
        </label>
        <button type="submit" class="btn btn-primary btn-block" disabled>Enregistrer le mot de passe</button>
      </form>

      <p class="auth-alt"><a href="connexion.html">← Retour à la connexion</a></p>
    </div>
  </div>
</main>

<site-footer></site-footer>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/supabase-client.js"></script>
<script src="js/cart.js"></script>
<script src="js/auth.js"></script>
</body>
</html>
