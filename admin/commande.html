<!doctype html>
<html lang="fr" data-root="../">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Détail de la commande — Administration CroqFruit</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Fraunces:ital,wght@0,300;0,400;0,500;0,600;1,400;1,500&family=Work+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/style.css">
<link rel="stylesheet" href="../css/dashboard.css">
<script src="../js/layout.js"></script>
</head>
<body class="is-checking">

<site-header variant="admin"></site-header>

<main class="wrap dash">
  <dash-nav set="admin" active="commandes"></dash-nav>

  <div class="dash-main">
    <ol class="crumbs"><li><a href="commandes.html">Commandes</a></li><li>Détail</li></ol>

    <div class="state-message" data-order-missing hidden>
      <strong>Commande introuvable</strong>
      Cette commande n'existe pas.<br>
      <a class="btn btn-primary" href="commandes.html">Retour aux commandes</a>
    </div>

    <div class="stack" style="gap:1.5rem" data-order-content hidden>
      <div class="dash-head">
        <div>
          <span class="eyebrow">Commande</span>
          <h1 data-order-title></h1>
          <p data-order-date></p>
        </div>
        <span data-order-status></span>
      </div>

      <p class="msg" data-notice hidden></p>

      <div class="split">
        <div class="stack" style="gap:1.5rem">
          <div class="table-wrap">
            <table class="data">
              <thead>
                <tr><th>Produit</th><th class="num">Quantité</th><th class="num">Prix unitaire</th><th class="num">Total</th></tr>
              </thead>
              <tbody data-order-items></tbody>
              <tfoot>
                <tr><td colspan="3">Sous-total</td><td class="num" data-order-subtotal></td></tr>
                <tr><td colspan="3">Livraison</td><td class="num" data-order-fee></td></tr>
                <tr><th colspan="3" scope="row">Total</th><th class="num" data-order-total></th></tr>
              </tfoot>
            </table>
          </div>

          <section class="panel">
            <h2>Notes internes</h2>
            <form class="form" id="notes-form">
              <label class="field">Note (visible uniquement par l'administration)
                <textarea name="notes" maxlength="2000"></textarea>
              </label>
              <div class="form-actions"><button type="submit" class="btn btn-primary">Enregistrer la note</button></div>
            </form>
          </section>
        </div>

        <div class="stack" style="gap:1.5rem">
          <section class="panel">
            <h2>Suivi</h2>
            <form class="form" id="status-form">
              <label class="field">Statut
                <select name="status">
                  <option value="pending">En attente</option>
                  <option value="preparing">En préparation</option>
                  <option value="out_for_delivery">En livraison</option>
                  <option value="delivered">Livrée</option>
                  <option value="cancelled">Annulée</option>
                </select>
              </label>
              <label class="field">Règlement
                <select name="payment">
                  <option value="unpaid">À régler</option>
                  <option value="paid">Payée</option>
                  <option value="refunded">Remboursée</option>
                </select>
              </label>
              <div class="form-actions"><button type="submit" class="btn btn-primary">Mettre à jour</button></div>
            </form>
          </section>

          <section class="panel">
            <h2>Client</h2>
            <dl class="info-list">
              <div class="info-row"><dt>Nom</dt><dd data-order-customer></dd></div>
              <div class="info-row"><dt>Email</dt><dd data-order-email></dd></div>
              <div class="info-row"><dt>Téléphone</dt><dd data-order-phone></dd></div>
            </dl>
          </section>

          <section class="panel">
            <h2>Livraison</h2>
            <dl class="info-list">
              <div class="info-row"><dt>Adresse</dt><dd data-order-address></dd></div>
              <div class="info-row"><dt>Créneau</dt><dd data-order-slot></dd></div>
              <div class="info-row"><dt>Instructions</dt><dd data-order-instructions></dd></div>
            </dl>
          </section>
        </div>
      </div>
    </div>
  </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../js/supabase-client.js"></script>
<script src="../js/utils.js"></script>
<script src="../js/auth.js"></script>
<script src="../js/admin.js"></script>
<script src="../js/admin-commande.js"></script>
</body>
</html>
