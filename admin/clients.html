<!doctype html>
<html lang="fr" data-root="../">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Clients — Administration CroqFruit</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Fraunces:ital,wght@0,300;0,400;0,500;0,600;1,400;1,500&family=Work+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/style.css">
<link rel="stylesheet" href="../css/dashboard.css">
<script src="../js/layout.js"></script>
</head>
<body>

<site-header variant="admin"></site-header>

<main class="wrap dash">
  <dash-nav set="admin" active="clients"></dash-nav>

  <div class="dash-main">
    <div class="dash-head">
      <div>
        <span class="eyebrow">Administration</span>
        <h1>Clients</h1>
        <p>Les comptes clients inscrits sur le site.</p>
      </div>
    </div>

    <p class="callout"><strong>Maquette.</strong> La liste sera alimentée par les comptes (authentification et table <code>profiles</code>). Ces données sont personnelles : leur consultation est réservée à l'administration.</p>

    <form class="toolbar" aria-label="Rechercher un client">
      <div class="toolbar-filters">
        <label class="field">Recherche
          <input type="search" name="q" placeholder="Nom ou email" disabled>
        </label>
      </div>
    </form>

    <div class="table-wrap">
      <table class="data">
        <thead>
          <tr><th>Nom</th><th>Email</th><th>Inscrit le</th><th class="num">Commandes</th><th></th></tr>
        </thead>
        <tbody>
          <tr><td class="empty" colspan="5">Aucun client pour le moment.</td></tr>
        </tbody>
      </table>
    </div>
  </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../js/supabase-client.js"></script>
<script src="../js/auth.js"></script>
</body>
</html>
