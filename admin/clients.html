<!doctype html>
<html lang="fr" data-root="../">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Clients — Administration CroqFruit</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Fraunces:ital,wght@0,300;0,400;0,500;0,600;1,400;1,500&family=Work+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/style.css">
<link rel="stylesheet" href="../css/dashboard.css">
<script src="../js/layout.js"></script>
</head>
<body class="is-checking">

<site-header variant="admin"></site-header>

<main class="wrap dash">
  <dash-nav set="admin" active="clients"></dash-nav>

  <div class="dash-main">
    <div class="dash-head">
      <div>
        <span class="eyebrow">Administration</span>
        <h1>Clients</h1>
        <p>Les comptes inscrits sur le site. Ces données sont personnelles : à n'utiliser que pour le service.</p>
      </div>
    </div>

    <form class="toolbar" aria-label="Rechercher un client" onsubmit="return false">
      <div class="toolbar-filters">
        <label class="field">Recherche
          <input type="search" id="client-search" placeholder="Nom ou email">
        </label>
      </div>
    </form>

    <div class="table-wrap">
      <table class="data">
        <thead>
          <tr><th>Nom</th><th>Email</th><th>Inscrit le</th><th>Type de compte</th></tr>
        </thead>
        <tbody id="clients-body">
          <tr><td class="empty" colspan="4">Chargement…</td></tr>
        </tbody>
      </table>
    </div>
  </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../js/supabase-client.js"></script>
<script src="../js/utils.js"></script>
<script src="../js/auth.js"></script>
<script src="../js/admin.js"></script>
<script src="../js/admin-clients.js"></script>
</body>
</html>
