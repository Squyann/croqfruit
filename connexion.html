<!doctype html>
<html lang="fr" data-root="">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Connexion — CroqFruit</title>
<meta name="description" content="Connectez-vous à votre compte CroqFruit pour passer commande et suivre vos livraisons.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Fraunces:ital,wght@0,300;0,400;0,500;0,600;1,400;1,500&family=Work+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<script src="js/layout.js"></script>
</head>
<body>

<site-header active=""></site-header>

<main class="auth-page">
  <div class="wrap">
    <div class="auth-card">
      <div>
        <span class="eyebrow">Compte</span>
        <h1>Connexion</h1>
        <p class="lede">Connectez-vous pour passer commande et suivre vos livraisons.</p>
      </div>

      <form id="login-form" class="form">
        <label class="field">Email
          <input type="email" name="email" required autocomplete="email">
        </label>
        <label class="field">Mot de passe
          <input type="password" name="password" required autocomplete="current-password">
        </label>
        <p class="msg msg-error" data-error hidden></p>
        <button type="submit" class="btn btn-primary btn-block">Se connecter</button>
      </form>

      <p class="auth-alt"><a href="mot-de-passe-oublie.html">Mot de passe oublié ?</a></p>
      <p class="auth-alt">Pas encore de compte ? <a href="inscription.html">Créer un compte</a></p>
    </div>
  </div>
</main>

<site-footer></site-footer>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/supabase-client.js"></script>
<script src="js/cart.js"></script>
<script src="js/auth.js"></script>
<script src="js/connexion.js"></script>
</body>
</html>
