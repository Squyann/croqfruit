<!doctype html>
<html lang="fr" data-root="">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mes adresses — CroqFruit</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Fraunces:ital,wght@0,300;0,400;0,500;0,600;1,400;1,500&family=Work+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/dashboard.css">
<script src="js/layout.js"></script>
</head>
<body class="is-checking">

<site-header active=""></site-header>

<main class="wrap dash">
  <dash-nav set="account" active="adresses"></dash-nav>

  <div class="dash-main">
    <div class="dash-head">
      <div>
        <span class="eyebrow">Mon compte</span>
        <h1>Mes adresses</h1>
        <p>Les adresses où vous souhaitez être livré. L'adresse par défaut est proposée en premier à la commande.</p>
      </div>
    </div>

    <p class="msg" data-notice hidden></p>

    <section class="panel">
      <h2>Adresses enregistrées</h2>
      <ul class="address-grid" id="address-list">
        <li class="state-message" style="padding-block:1.5rem;grid-column:1/-1">Chargement…</li>
      </ul>
    </section>

    <section class="panel" id="address-panel">
      <h2 data-form-title>Ajouter une adresse</h2>
      <form class="form" id="address-form">
        <p class="msg msg-error" data-limit hidden>Vous avez atteint le maximum de 10 adresses : supprimez-en une pour en ajouter une nouvelle.</p>
        <label class="field">Nom de l'adresse
          <input type="text" name="label" maxlength="40" placeholder="Maison, bureau…">
        </label>
        <label class="field">Adresse
          <input type="text" name="street" autocomplete="address-line1" minlength="3" maxlength="150" required>
        </label>
        <label class="field">Complément d'adresse
          <input type="text" name="street2" autocomplete="address-line2" maxlength="150" placeholder="Bâtiment, étage, escalier…">
        </label>
        <div class="field-row">
          <label class="field">Code postal
            <input type="text" name="postalCode" inputmode="numeric" autocomplete="postal-code" pattern="[0-9]{5}" maxlength="5" required>
          </label>
          <label class="field">Ville
            <input type="text" name="city" autocomplete="address-level2" maxlength="80" required>
          </label>
        </div>
        <label class="field">Instructions pour le livreur
          <textarea name="notes" maxlength="500" placeholder="Code d'accès, interphone, lieu de dépose…"></textarea>
        </label>
        <label class="check">
          <input type="checkbox" name="isDefault">
          <span>Utiliser comme adresse par défaut</span>
        </label>
        <div class="form-actions">
          <button type="submit" class="btn btn-primary">Ajouter l'adresse</button>
          <button type="button" class="btn btn-ghost" data-cancel hidden>Annuler</button>
        </div>
      </form>
    </section>
  </div>
</main>

<site-footer></site-footer>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/supabase-client.js"></script>
<script src="js/utils.js"></script>
<script src="js/cart.js"></script>
<script src="js/auth.js"></script>
<script src="js/compte.js"></script>
<script src="js/compte-adresses.js"></script>
</body>
</html>
