<!doctype html>
<html lang="fr" data-root="">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Détail de la commande — CroqFruit</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Fraunces:ital,wght@0,300;0,400;0,500;0,600;1,400;1,500&family=Work+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/dashboard.css">
<script src="js/layout.js"></script>
</head>
<body class="is-checking">

<site-header active=""></site-header>

<main class="wrap dash">
  <dash-nav set="account" active="commandes"></dash-nav>

  <div class="dash-main">
    <ol class="crumbs"><li><a href="compte.html">Mon compte</a></li><li><a href="compte-commandes.html">Mes commandes</a></li><li>Détail</li></ol>

    <div class="state-message" data-order-missing hidden>
      <strong>Commande introuvable</strong>
      Cette commande n'existe pas ou n'est pas associée à votre compte.<br>
      <a class="btn btn-primary" href="compte-commandes.html">Mes commandes</a>
    </div>

    <div class="stack" style="gap:1.5rem" data-order-content hidden>
      <div class="dash-head">
        <div>
          <span class="eyebrow">Commande</span>
          <h1 data-order-title></h1>
          <p data-order-date></p>
        </div>
        <span data-order-status></span>
      </div>

      <div class="table-wrap">
        <table class="data">
          <thead>
            <tr><th>Produit</th><th class="num">Quantité</th><th class="num">Prix unitaire</th><th class="num">Total</th></tr>
          </thead>
          <tbody data-order-items></tbody>
        </table>
      </div>

      <div class="split">
        <section class="panel">
          <h2>Livraison</h2>
          <dl class="info-list" style="border-bottom:0">
            <div class="info-row"><dt>Adresse</dt><dd data-order-address></dd></div>
            <div class="info-row"><dt>Créneau</dt><dd data-order-slot></dd></div>
            <div class="info-row"><dt>Instructions</dt><dd data-order-notes></dd></div>
          </dl>
        </section>
        <aside class="summary">
          <h2>Montant</h2>
          <div class="summary-row"><span>Sous-total</span><span data-order-subtotal></span></div>
          <div class="summary-row"><span>Livraison</span><span data-order-fee></span></div>
          <div class="summary-row summary-total"><span>Total</span><span data-order-total></span></div>
          <div class="summary-row"><span>Règlement</span><span data-order-payment></span></div>
        </aside>
      </div>
    </div>
  </div>
</main>

<site-footer></site-footer>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/supabase-client.js"></script>
<script src="js/utils.js"></script>
<script src="js/cart.js"></script>
<script src="js/auth.js"></script>
<script src="js/compte.js"></script>
<script src="js/compte-commande.js"></script>
</body>
</html>
